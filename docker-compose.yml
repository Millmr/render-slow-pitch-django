# Local development: Postgres + Django dev server with live reload.
#   make up        start everything (http://localhost:8000)
#   make test      run the test suite against Postgres
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: slowpitch
      POSTGRES_USER: slowpitch
      POSTGRES_PASSWORD: slowpitch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slowpitch -d slowpitch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: slowpitch-api:dev
    pull_policy: build
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-not-secret
      DATABASE_URL: postgres://slowpitch:slowpitch@db:5432/slowpitch
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      # The React app (separate repo) running on Vite's dev server.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
